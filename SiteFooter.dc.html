<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<footer
				style="text-align: center; padding: 24px; font-size: 13.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; background: {{ footerBg }}; color: {{ footerText }}">
				<div
					style="display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap; line-height: 1.5">
					<span>© {{ year }} {{ owner }}</span>
					<span style="opacity: .5; display: {{ creditShow }}">·</span>
					<span style="display: {{ creditShow }}">{{ credit }}</span>
					<span style="opacity: .5; display: {{ repoShow }}">·</span>
					<a href="{{ repoUrl }}"
						style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: {{ footerLink }}; display: {{ repoShow }}">{{
						repoLabel }}</a>
				</div>
			</footer>

		</x-dc>
		<script type="text/x-dc" data-dc-script
			data-props="{&quot;$preview&quot;:{&quot;width&quot;:930,&quot;height&quot;:80},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
			/* Footer chrome, shared by every page. Content comes from site.yml so the
			name, credit line and repo link are edited in one place; the palette
			arrives as the t prop the pages already pass to SiteNav. */
			const FALLBACK = { footerBg: "#161A26", footerText: "#D6DAE4", footerLink: "#FBFBFD" };

			class Component extends DCLogic {
				state = { cfg: null };

				componentDidMount() {
					if (window.SiteData) {
						window.SiteData.ready().then(cfg => this.setState({ cfg: cfg || {} }));
					}
				}

				renderVals() {
					const t = this.props.t || FALLBACK;
					// Read from state, not SiteData.cfg, so the render that follows
					// site.yml landing actually picks the values up.
					const cfg = this.state.cfg || {};
					const repo = cfg.repo || {};

					const credit = cfg.credit || "";
					const repoUrl = repo.url || "";
					const repoLabel = repo.label || repoUrl;

					return {
						year: new Date().getFullYear(),
						owner: (cfg.owner || {}).name || "",
						credit: credit,
						creditShow: credit ? "inline" : "none",
						repoUrl: repoUrl,
						repoLabel: repoLabel,
						repoShow: repoUrl ? "inline" : "none",
						footerBg: t.footerBg || FALLBACK.footerBg,
						footerText: t.footerText || FALLBACK.footerText,
						footerLink: t.footerLink || FALLBACK.footerLink
					};
				}
			}

		</script>
	</body>
</html>
