<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- The DC runtime resolves <dc-import name="X"> by fetching "./X.dc.html"
		     (COMPONENT_DIR is baked into the generated support.js). The components
		     live in src/components/, so remap those two URLs before the runtime
		     loads. Without this the nav and footer render as empty placeholders. -->
		<script>window.__resources = {
			"./SiteNav.dc.html": "./src/components/SiteNav.dc.html",
			"./SiteFooter.dc.html": "./src/components/SiteFooter.dc.html"
		};</script>
		<script src="./src/lib/support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<title>blog — Andrea Giuseppe Landella</title>
				<link rel="stylesheet"
					href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
					crossorigin="anonymous" referrerpolicy="no-referrer">
				<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
				<script src="./src/lib/site-theme.js"></script>
				<script src="./src/lib/site-data.js"></script>
				<style>
					html { scroll-behavior: smooth; }
					body { margin: 0; background: #e8e9ee; color: #161A26; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
					a { color: #2E5BD8; text-decoration: none; }
					a:hover { text-decoration: underline; }
					/* Hide the browser's built-in clear button on type="search";
					   the page draws its own so two would otherwise appear. */
					input[type="search"]::-webkit-search-cancel-button,
					input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
					input[type="search"]::-ms-clear { display: none; width: 0; height: 0; }
				</style>
			</helmet>

			<div
				style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; line-height: 1.5; letter-spacing: -0.005em; min-height: 100vh; display: flex; flex-direction: column; transition: background-color .2s ease, color .2s ease; background: {{ t.bg }}; color: {{ t.text }}">

				<dc-import name="SiteNav" t="{{ t }}" base="index.html" active="blog"
					theme-icon="{{ themeIcon }}" theme-title="{{ themeTitle }}"
					on-cycle="{{ cycleTheme }}" style="position: sticky; top: 0; z-index: 20"
					hint-size="100%,66px"></dc-import>

				<main style="flex: 1 0 auto; align-self: center; box-sizing: border-box; width: 100%; max-width: calc(930px + 48px); padding: 56px 24px 0">
					<h1
						style="margin: 0; font-size: 38px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.15">blog</h1>
					<p
						style="margin: 12px 0 24px; font-size: 17px; color: {{ t.muted }}">{{
						blurb }}</p>

					<div
						style="display: flex; align-items: center; gap: 12px; margin: 0 0 8px; flex-wrap: wrap">
						<div
							style="position: relative; display: flex; align-items: center; flex: 1 1 260px; max-width: 420px">
							<i class="fa-solid fa-magnifying-glass"
								style="position: absolute; left: 12px; font-size: 12px; pointer-events: none; color: {{ t.muted }}"></i>
							<input type="search" value="{{ query }}" onInput="{{ onSearch }}"
								placeholder="Search titles, text, or tags…"
								aria-label="Search posts"
								style="width: 100%; box-sizing: border-box; padding: 8px 32px 8px 32px; border-radius: 999px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; outline: none; border: 1px solid {{ t.divider }}; background: {{ t.cardBg }}; color: {{ t.text }}">
							<button type="button" onClick="{{ clearTags }}" aria-label="Clear search"
								style="position: absolute; right: 10px; cursor: pointer; border: none; background: none; padding: 2px 4px; line-height: 1; font-size: 13px; color: {{ t.muted }}; display: {{ clearShow }}"
								style-hover="color: {{ t.accent }}">&times;</button>
						</div>
						<span role="status" aria-live="polite"
							style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; white-space: nowrap; color: {{ t.muted }}; display: {{ hintShow }}">type
							at least 3 characters</span>
					</div>
					<p
						style="margin: 0 0 28px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: {{ t.muted }}">{{
						countNote }}</p>

					<sc-for list="{{ groups }}" as="group" hint-placeholder-count="2">
						<section style="margin: 0 0 40px">
							<h2
								style="margin: 0 0 4px; padding-bottom: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.1em; color: {{ t.muted }}; border-bottom: 1px solid {{ t.divider }}">{{
								group.year }}</h2>
							<div style="display: flex; flex-direction: column">
								<sc-for list="{{ group.items }}" as="post" hint-placeholder-count="2">
									<article
										style="display: flex; gap: 20px; align-items: flex-start; padding: 22px 0; border-bottom: 1px solid {{ t.divider }}; opacity: 0.6; transition: opacity .2s ease"
										style-hover="opacity: 1">
										<a href="{{ post.href }}"
											style="flex-shrink: 0; width: 104px; height: 74px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; text-align: center; color: {{ t.muted }}; background: {{ t.codeBg }}; border: 1px dashed {{ t.dash }}"
											style-hover="border-color: {{ t.accent }}; text-decoration: none">{{
											post.thumbNode }}<sc-if value="{{ post.noThumb }}"
												hint-placeholder-val="{{ true }}"><span>image</span></sc-if></a>
										<div style="flex: 1; min-width: 0">
											<a href="{{ post.href }}"
												style="color: {{ t.text }}; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; display: inline-block"
												style-hover="color: {{ t.accent }}; text-decoration: none">{{
												post.title }}</a>
											<p
												style="margin: 8px 0 0; font-size: 15.5px; color: {{ t.muted }}">{{
												post.summary }}</p>
											<p
												style="margin: 10px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: {{ t.muted }}">{{
												post.meta }}</p>
											<div
												style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px">
												<sc-for list="{{ post.tags }}" as="tg"
													hint-placeholder-count="2">
													<button type="button" onClick="{{ tg.pick }}"
														title="Search for this tag"
														style="cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.03em; padding: 2px 9px; border-radius: 999px; transition: all .15s ease; border: 1px solid {{ t.divider }}; background: none; color: {{ t.muted }}"
														style-hover="border-color: {{ t.accent }}; color: {{ t.accent }}">{{
														tg.label }}</button>
												</sc-for>
											</div>
										</div>
									</article>
								</sc-for>
							</div>
						</section>
					</sc-for>

					<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
						<p
							style="margin: 0 0 40px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; color: {{ t.muted }}">{{
							emptyNote }}</p>
					</sc-if>

					<div
						style="margin: 40px 0 64px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px">
						<a href="index.html#about" style="color: {{ t.muted }}">← back to about</a>
					</div>
				</main>

				<dc-import name="SiteFooter" t="{{ t }}" hint-size="100%,80px"></dc-import>
			</div>

		</x-dc>
		<script type="text/x-dc" data-dc-script>
			const T = window.SiteTheme;

			class Component extends DCLogic {
				state = { setting: "system", systemDark: false, posts: null, err: "", query: "", cfg: null };

				componentDidMount() {
					// Tag links from post.html arrive as #tag=foo and prefill the search.
					// A malformed hash (e.g. "#tag=%") would otherwise throw out of mount.
					let fromTag = "";
					const m = String(location.hash || "").match(/^#tag=(.+)$/);
					if (m) { try { fromTag = decodeURIComponent(m[1]); } catch (e) { fromTag = m[1]; } }

					this.setState(Object.assign(T.start(this), { query: fromTag }));
					this.grab();
				}

				componentWillUnmount() { T.stop(this); }

				grab() {
					const S = window.SiteData;
					// site.yml (theme) and the content file do not depend on each other,
					// so start both now instead of chaining the content behind ready().
					// That removes one full round trip from the critical path.
					const data = S.load("content/posts.yml");
					S.ready()
					.then(cfg => this.setState({ cfg: cfg || {} }))
					.then(() => data)
					.then(d => this.setState({ posts: S.validate("content/posts.yml", d, ["title"], true) }))
					.catch(e => this.setState({ err: String(e && e.message || e) }));
				}

				componentDidUpdate() { T.sync(this.state); }

				setQuery(q) {
					this.setState({ query: q });
				}

				renderVals() {
					const S = window.SiteData;
					const t = T.PALETTES[T.resolve(this.state)];

					const base = Object.assign({
						year: new Date().getFullYear(),
						blurb: ((this.state.cfg || {}).blurbs || {}).blog || "",
						query: this.state.query,
						onSearch: e => this.setQuery(e && e.target ? e.target.value : ""),
						clearTags: () => this.setQuery(""),
						clearShow: this.state.query ? "block" : "none",
						hintShow: (function (n) { return n > 0 && n < 3 ? "inline" : "none"; })(String(this.state.query || "").trim().length),
						groups: [], countNote: "", empty: false, emptyNote: ""
					}, T.vals(this));

					const all = this.state.posts;
					if (this.state.err) return Object.assign(base, { empty: true, emptyNote: "Could not read posts.yml — " + this.state.err });
					if (!all) return Object.assign(base, { countNote: "loading…" });

					const live = all.filter(p => p && !p.draft && p.slug);

					// Free-text search across title, summary and tags.
					// Bodies are excluded, and queries under 3 characters are ignored,
					// so short strings do not match prose inside every post.
					const raw = String(this.state.query || "").trim().toLowerCase();
					const q = raw.length >= 3 ? raw : "";
					const hay = p => [p.title, p.summary, S.tagsOf(p).join(" ")]
						.filter(Boolean).join(" ").toLowerCase();
					const shown = q ? live.filter(p => hay(p).indexOf(q) >= 0) : live;

					const sorted = shown.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
					const groups = [];
					sorted.forEach(p => {
						const y = S.yearOf(p.date) || "undated";
						let g = groups.filter(x => x.year === String(y))[0];
						if (!g) { g = { year: String(y), items: [] }; groups.push(g); }
						g.items.push({
							href: "post.html#" + p.slug,
							title: p.title || p.slug,
							summary: p.summary || "",
							meta: [S.fmtDate(p.date), S.readTime(p.body) + " min read"].filter(Boolean).join(" · "),
							tags: S.tagsOf(p).map(x => ({ label: x, pick: () => this.setQuery(x) })),
							thumbNode: p.image ? React.createElement("img", { src: p.image, alt: p.title || "", style: { width: "100%", height: "100%", objectFit: "cover" } }) : null,
							noThumb: !p.image
						});
					});

					return Object.assign(base, {
						groups: groups,
						countNote: sorted.length + (sorted.length === 1 ? " post" : " posts")
							+ (q ? ' matching "' + this.state.query.trim() + '"' : ""),
						empty: sorted.length === 0,
						emptyNote: live.length ? "No posts match that search." : "No posts in posts.yml yet."
					});
				}
			}

		</script>
	</body>
</html>
