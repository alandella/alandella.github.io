# =============================================================
#  publications.yml — every publication on the site.
#  Newest first. name is bolded automatically wherever
#  it appears in an author list (match: "Landella").
#
#  Fields
#    year           publication year
#    title          paper title
#    authors        [Name M. Surname, Name M. Surname]
#    journal        full journal name
#    journal_short  the small coloured chip (e.g. J. Catal.)
#    journal_color  chip colour as hex, e.g. "#B23A48". Leave empty to
#                   use the site accent colour.
#    volume         volume / issue
#    pages          page range
#    doi            10.xxxx/xxxxx  — becomes the DOI badge
#    pdf            link for a PDF badge
#    code           link for a CODE badge
#    badge          highlight label, e.g. Editor's pick
#    abstract       full abstract, shown by the ABS toggle
#    selected       true = also on the about page (newest 2)
#    bibtex         paste your own entry here (use "bibtex: |").
#                   Nothing is auto-generated — the BIB button
#                   only appears when this field is filled in.
# =============================================================

- year: 2021
  title: Publication 1
  authors: [Author list]
  journal: Journal Extended Title
  journal_short: J. Short. T.
  journal_color: 
  volume: vol. XX: no. YY
  pages: pp. XX-YY
  doi: 10.0000/placeholder1
  pdf: link-to-pdf
  code: https://github.com/username/repository
  badge: editor's pick
  selected: true
  bibtex: |
    @article{placeholder1,
      title   = {Publication 1},
      author  = {Landella, A. G. and Coauthor, B.},
      journal = {Extended journal title},
      year    = {20XX},
      volume  = {00},
      pages   = {1--12},
      doi     = {10.0000/placeholder1}
    }
  abstract: Abstract of the publication. Paste the full abstract here — it expands and collapses when ABS is clicked.

