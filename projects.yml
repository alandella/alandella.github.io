# =============================================================
#  projects.yml — every project on the site.
#  The about page carousel shows the ones with selected: true;
#  projects.html shows all of them.
#
#  Fields
#    slug      unique id
#    title     project name
#    summary   one line, shown on the card
#    image     card image path; empty = dashed placeholder
#    tags      [one, two]
#    year      shown on the card and the project page
#    status    e.g. ongoing, completed
#    role      your role, e.g. lead developer
#    link      external site — becomes a LINK badge
#    repo      code repository — becomes a CODE badge
#    paper     paper / preprint url — becomes a PAPER badge
#    doi       10.xxxx/xxxxx — becomes a DOI badge
#    selected  true = appears in the about page carousel
#    body      the project page itself, markdown (use "body: |").
#              Same syntax as posts.yml: ## headings, lists,
#              tables, code fences, $math$, ![](assets/x.png)
#
#  Card titles link to project.html#<slug>, which renders the
#  matching entry below.
# =============================================================

- slug: project-1
  title: Project 1
  summary: What it does
  image:
  tags: [tag one, tag two]
  year: 20XX
  status: ongoing
  role:
  link:
  repo: https://github.com/username/repository
  paper:
  doi:
  selected: true
  body: |
    ## Overview

    What the project is and why it exists. Markdown works the same
    way as in posts.yml — headings, lists, code fences, tables,
    images and $math$.

    ## Approach

    - first thing
    - second thing

    ## Results

    What came out of it.

