<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="../lib/support.js"></script>
	</head>
	<body>
		<x-dc>
			<nav
				style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 24px; backdrop-filter: blur(10px) saturate(1.1); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; background: {{ navBg }}; border-bottom: 1px solid {{ divider }}">
				<a href="{{ homeHref }}" onClick="{{ onHome }}"
					style="display: flex; align-items: baseline; gap: 10px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; color: {{ text }}"
					style-hover="text-decoration: none">
					<img src="assets/logo.svg" alt
						style="width: 22px; height: 23px; display: block; align-self: center">
					<span aria-hidden="true"
						style="align-self: center; width: 1px; height: 22px; border-radius: 1px; opacity: .45; background: currentColor; user-select: none"></span>
					<span style="letter-spacing: -0.04em; font-weight: 700">AGL</span>
				</a>
				<div
					style="display: flex; align-items: baseline; gap: 22px; font-size: 14.5px; flex-wrap: wrap">
					<div ref="{{ listRef }}"
						style="position: relative; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-bottom: 4px">
						<sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
							<a href="{{ link.href }}" onClick="{{ link.onClick }}"
								data-nav="{{ link.label }}" style="color: {{ text }}"
								style-hover="text-decoration: none">{{ link.label }}</a>
						</sc-for>
						<span
							style="position: absolute; bottom: 0; height: 2px; border-radius: 1px; transition: {{ barTransition }}; background: {{ accent }}; left: {{ barLeft }}; width: {{ barWidth }}; opacity: {{ barOpacity }}"></span>
					</div>
					<button type="button" onClick="{{ onCycle }}" title="{{ themeTitle }}"
						aria-label="{{ themeTitle }}"
						style="align-self: center; background: none; cursor: pointer; width: 24px; height: 24px; padding: 0; box-sizing: border-box; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; border: 1px solid {{ divider }}; color: {{ text }}">
						<i class="{{ themeIcon }}"></i>
					</button>
				</div>
			</nav>

		</x-dc>
		<script type="text/x-dc" data-dc-script
			data-props="{&quot;$preview&quot;:{&quot;width&quot;:930,&quot;height&quot;:66},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;base&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;about&quot;,&quot;projects&quot;,&quot;publications&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;about&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;themeIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;fa-solid fa-circle-half-stroke&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;themeTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Toggle theme&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onCycle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
			const FALLBACK = { navBg: "rgba(232,233,238,0.5)", text: "#161A26", accent: "#2E5BD8", divider: "#D6DAE4" };
			const LABELS = ["about", "projects", "publications", "blog"];

			class Component extends DCLogic {
				state = { active: null, bar: { left: 0, width: 0, ready: false, settled: false } };

				componentDidMount() {
					this.listRef = this.listRef || null;
					this.setActive(this.props.active || "about");

					if (!this.props.base) {
						this.onScroll = () => {
							const sections = Array.prototype.slice.call(document.querySelectorAll("main section[id]"));
							if (!sections.length) return;

							if (this.pending) {
							const target = sections.filter(s => s.id === this.pending)[0];
							const reached = target && Math.abs(target.getBoundingClientRect().top - 80) < 45;
							if (reached || (this.pendingSince && Date.now() - this.pendingSince > 2500)) {
									this.pending = null;
								} else {
									return;
								}
							}

							const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 4;
							if (atBottom) { this.setActive(sections[sections.length - 1].id); return; }

							let current = sections[0].id;
							let best = Infinity;
							sections.forEach(s => {
								const top = s.getBoundingClientRect().top;
								const d = Math.abs(top - 90);
								if (top <= 200 && d < best) { best = d; current = s.id; }
							});
							this.setActive(current);
						};
						window.addEventListener("scroll", this.onScroll, { passive: true });
						this.onScroll();
					}
					this.onHash = () => {
						const id = (location.hash || "").replace("#", "");
						if (LABELS.indexOf(id) >= 0) this.setActive(id);
					};
					window.addEventListener("hashchange", this.onHash);
					this.onResize = () => this.measure();
					window.addEventListener("resize", this.onResize);
					setTimeout(() => this.measure(), 60);
				}

				componentWillUnmount() {
					this.dead = true;
					if (this.settleRaf) { cancelAnimationFrame(this.settleRaf); this.settleRaf = 0; }
					if (this.settleTimer) { clearTimeout(this.settleTimer); this.settleTimer = 0; }
					if (this.onScroll) window.removeEventListener("scroll", this.onScroll);
					window.removeEventListener("hashchange", this.onHash);
					window.removeEventListener("resize", this.onResize);
				}

				setActive(id) {
					if (this.state.active === id) return;
					this.setState({ active: id }, () => this.measure());
				}

				measure() {
					const list = this.listEl;
					if (!list || !this.state.active) return;
					const el = list.querySelector('[data-nav="' + this.state.active + '"]');
					if (!el) return;
					const lr = list.getBoundingClientRect();
					const er = el.getBoundingClientRect();
					const cur = this.state.bar;
					const next = { left: er.left - lr.left, width: er.width, ready: true, settled: cur.settled };
					if (Math.abs(cur.left - next.left) > 0.5 || Math.abs(cur.width - next.width) > 0.5 || !cur.ready) {
						this.setState({ bar: next }, () => {
							/* Arm the slide only after the first placement has painted, so
							   that first frame jumps and every later one animates. A frame
							   is enough to commit the paint; the timer is a fallback for
							   when frames stop being serviced (background tab), which must
							   never leave the transition permanently off. */
							if (this.state.bar.settled || this.settleQueued) return;
							this.settleQueued = true;
							const settle = () => {
								if (this.dead) return;
								if (this.settleRaf) { cancelAnimationFrame(this.settleRaf); this.settleRaf = 0; }
								if (this.settleTimer) { clearTimeout(this.settleTimer); this.settleTimer = 0; }
								this.settleQueued = false;
								if (this.state.bar.settled) return;
								this.setState({ bar: Object.assign({}, this.state.bar, { settled: true }) });
							};
							this.settleRaf = requestAnimationFrame(settle);
							this.settleTimer = setTimeout(settle, 120);
						});
					}
				}

				renderVals() {
					const t = this.props.t || FALLBACK;
					const base = this.props.base || "";
					const PAGES = {
						blog: "blog.html",
						projects: "projects.html",
						publications: "publications.html"
					};
					const links = LABELS.map(label => ({
						label,
						href: PAGES[label] || (base + "#" + label),
						onClick: PAGES[label] ? undefined : () => {
							this.pending = label;
							this.pendingSince = Date.now();
							this.setActive(label);
							setTimeout(() => { if (this.onScroll) this.onScroll(); }, 1200);
						}
					}));
					return {
						links,
						navBg: t.navBg, text: t.text, divider: t.divider, accent: t.accent,
						homeHref: base || "#about",
						onHome: base ? undefined : (e => {
							if (e && e.preventDefault) e.preventDefault();
							this.pending = "about";
							this.pendingSince = Date.now();
							this.setActive("about");
							window.scrollTo({ top: 0, behavior: "smooth" });
						}),
						listRef: el => { this.listEl = el; if (el) this.measure(); },
						barLeft: this.state.bar.left + "px",
						barWidth: this.state.bar.width + "px",
						barOpacity: this.state.bar.ready ? 1 : 0,
						/* The bar starts at left:0 — which is exactly where the first
						   link ("about") sits. Animating that first placement makes every
						   page load look like the underline slid over from "about".
						   So the initial jump is instant; only later moves (scroll-spy on
						   the about page, a resize) slide. */
						barTransition: this.state.bar.settled
							? "left .28s cubic-bezier(.4, 0, .2, 1), width .28s cubic-bezier(.4, 0, .2, 1), opacity .2s ease"
							: "opacity .2s ease",
						themeIcon: this.props.themeIcon || "fa-solid fa-circle-half-stroke",
						themeTitle: this.props.themeTitle || "Toggle theme",
						onCycle: this.props.onCycle
					};
				}
			}

		</script>
	</body>
</html>
